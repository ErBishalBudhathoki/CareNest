allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    project.evaluationDependsOn(':app')

    // Suppress obsolete javac source/target option warnings from third-party plugins.
    project.tasks.withType(JavaCompile).configureEach {
        options.warnings = false
        options.deprecation = false
        if (!options.compilerArgs.contains('-Xlint:none')) {
            options.compilerArgs.add('-Xlint:none')
        }
        if (!options.compilerArgs.contains('-Xlint:-options')) {
            options.compilerArgs.add('-Xlint:-options')
        }
        if (!options.compilerArgs.contains('-Xlint:-deprecation')) {
            options.compilerArgs.add('-Xlint:-deprecation')
        }
        if (!options.compilerArgs.contains('-Xlint:-unchecked')) {
            options.compilerArgs.add('-Xlint:-unchecked')
        }
    }
}

subprojects {
    project.configurations.all {
        resolutionStrategy.force 'com.android.tools.build:gradle:8.11.1'
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
