plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def env = new Properties()
def envFile = rootProject.file('../.env')
if (envFile.exists()) {
    envFile.withReader('UTF-8') { reader ->
        env.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Load keystore properties
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.bishal.invoice"
    compileSdkVersion 36
    ndkVersion localProperties.getProperty('flutter.ndkVersion')

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.bishal.invoice"
        minSdkVersion 24
        targetSdk 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
        
        manifestPlaceholders = [
            applicationName: "android.app.Application",
            GOOGLE_MAPS_API_KEY_FOR_ANDROID: env.getProperty('GOOGLE_MAPS_API_KEY_FOR_ANDROID') ?: ""
        ]

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }
    
    flavorDimensions "environment"
    
    productFlavors {
        development {
            dimension "environment"
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
            resValue "string", "app_name", "CareNest Dev"
        }
        
        production {
            dimension "environment"
            resValue "string", "app_name", "CareNest"
        }
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }

        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        buildConfig true
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation 'androidx.window:window:1.4.0'
    implementation 'androidx.window:window-java:1.4.0'
    implementation platform('com.google.firebase:firebase-bom:34.1.0')
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation "com.google.firebase:firebase-appcheck-playintegrity"
    // Replace SafetyNet with Play Integrity API
    implementation 'com.google.android.play:integrity:1.5.0'
    // Edge-to-edge display support
    implementation 'androidx.core:core-splashscreen:1.0.1'

    // Testing dependencies
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'tools.fastlane:screengrab:2.1.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}

configurations.all {
    resolutionStrategy {
        force 'androidx.test.espresso:espresso-core:3.5.1'
        force 'androidx.test:runner:1.5.2'
        force 'androidx.test:rules:1.5.0'
        force 'androidx.test.ext:junit:1.1.5'
    }
    // Exclude deprecated SafetyNet API (replaced by Play Integrity API)
    exclude group: 'com.google.android.gms', module: 'play-services-safetynet'
    exclude group: 'com.google.firebase', module: 'firebase-appcheck-safetynet'
}
