# ✅ Java memory settings
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC -XX:+UseStringDeduplication

# ✅ AndroidX & Jetifier support
android.useAndroidX=true
android.enableJetifier=true

# ⚠️ Suppresses compile SDK warning (okay for now but watch for future AGP changes)
android.suppressUnsupportedCompileSdk=36
android.javaCompile.suppressSourceTargetDeprecationWarning=true

# ✅ Optional but helpful R class settings
android.nonTransitiveRClass=false

# ✅ Recommended additions (optional)
kotlin.code.style=official
org.gradle.parallel=true
org.gradle.configureondemand=true

# ✅ Daemon settings
org.gradle.daemon=true
org.gradle.daemon.idletimeout=10800000
kotlin.incremental=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
