# Requires a real organization code for the current org.
# Example run:
# maestro test .maestro/create_employees_bulk.yaml -e ORG_CODE=ABC123
appId: ${APP_ID}
name: Create Multiple Employees
env:
  APP_ID: com.bishal.invoice.dev
  ORG_CODE: AKM71X
  EMPLOYEE_PASSWORD: Bishal@xiomi222
---
- launchApp:
    clearState: true

- tapOn:
    point: 7%,10%
    optional: true
- extendedWaitUntil:
    visible: "Enter your email"
    timeout: 15000
- tapOn:
    point: 50%,78%
- extendedWaitUntil:
    visible: "John"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Join Existing Organization"
- tapOn:
    point: 73%,65%
- extendedWaitUntil:
    visible: "Enter code"
    timeout: 5000
- tapOn: "Enter code"
- inputText: ${ORG_CODE}
- scrollUntilVisible:
    element:
      text: "John"
    direction: UP
- tapOn: "John"
- inputText: "Ava"
- tapOn: "Doe"
- inputText: "Worker"
- tapOn: "john@example.com"
- inputText: "employee.seed.1@mailinator.com"
- tapOn: "11 digits (numbers only)"
- inputText: "11111111111"
- scrollUntilVisible:
    element:
      text: "Password must be at least 6 characters"
- tapOn: "Password must be at least 6 characters"
- inputText: ${EMPLOYEE_PASSWORD}
- scrollUntilVisible:
    element:
      text: "Re-enter password"
- tapOn: "Re-enter password"
- inputText: ${EMPLOYEE_PASSWORD}
- tapOn: done
- swipe:
    start: 50%, 75%
    end: 50%, 30%
- waitForAnimationToEnd
- swipe:
    start: 50%, 75%
