appId: ${APP_ID}
name: Create Multiple Businesses
env:
  APP_ID: com.bishal.invoice.dev
  ADMIN_EMAIL: deverbishal331@gmail.com
  ADMIN_PASSWORD: Bishal@xiomi222
---
- launchApp:
    clearState: true

- assertVisible: "Login"
- tapOn: "Enter your email"
- inputText: ${ADMIN_EMAIL}
- tapOn: "Enter your password"
- inputText: ${ADMIN_PASSWORD}
- tapOn:
    point: 0%,35%
- tapOn: "Sign in"

- extendedWaitUntil:
    visible: "ASSIGN"
    timeout: 30000

- scrollUntilVisible:
    element:
      text: "Add Business"
- tapOn: "Add Business"
- extendedWaitUntil:
    visible: "Business Name"
    timeout: 15000
- tapOn: "Business Name"
- inputText: "Seed Care East"
- tapOn: "Business Email"
- inputText: "business.seed.1@mailinator.com"
- tapOn: "Business Phone"
- inputText: "0290000001"
- scrollUntilVisible:
    element:
      text: "Business Address"
- tapOn: "Business Address"
- inputText: "11 George Street"
- tapOn: "City"
- inputText: "Sydney"
- tapOn: "State"
- inputText: "NSW"
- tapOn: "Zip Code"
- inputText: "2000"
- tapOn:
    point: 0%,20%
- scrollUntilVisible:
    element:
      text: "ADD BUSINESS"
- tapOn: "ADD BUSINESS"
- extendedWaitUntil:
    visible: "OK"
    timeout: 20000
- tapOn: "OK"

- scrollUntilVisible:
    element:
      text: "Add Business"
- tapOn: "Add Business"
- extendedWaitUntil:
    visible: "Business Name"
    timeout: 15000
- tapOn: "Business Name"
- inputText: "Seed Care North"
- tapOn: "Business Email"
- inputText: "business.seed.2@mailinator.com"
- tapOn: "Business Phone"
- inputText: "0290000002"
- scrollUntilVisible:
    element:
      text: "Business Address"
- tapOn: "Business Address"
- inputText: "22 Queen Street"
- tapOn: "City"
- inputText: "Melbourne"
- tapOn: "State"
- inputText: "VIC"
- tapOn: "Zip Code"
- inputText: "3000"
- tapOn:
    point: 0%,20%
- scrollUntilVisible:
    element:
      text: "ADD BUSINESS"
- tapOn: "ADD BUSINESS"
- extendedWaitUntil:
    visible: "OK"
    timeout: 20000
- tapOn: "OK"

- scrollUntilVisible:
    element:
      text: "Add Business"
- tapOn: "Add Business"
- extendedWaitUntil:
    visible: "Business Name"
    timeout: 15000
- tapOn: "Business Name"
- inputText: "Seed Care West"
- tapOn: "Business Email"
- inputText: "business.seed.3@mailinator.com"
- tapOn: "Business Phone"
- inputText: "0290000003"
- scrollUntilVisible:
    element:
      text: "Business Address"
- tapOn: "Business Address"
- inputText: "33 Adelaide Street"
- tapOn: "City"
- inputText: "Brisbane"
- tapOn: "State"
- inputText: "QLD"
- tapOn: "Zip Code"
- inputText: "4000"
- tapOn:
    point: 0%,20%
- scrollUntilVisible:
    element:
      text: "ADD BUSINESS"
- tapOn: "ADD BUSINESS"
- extendedWaitUntil:
    visible: "OK"
    timeout: 20000
- tapOn: "OK"
