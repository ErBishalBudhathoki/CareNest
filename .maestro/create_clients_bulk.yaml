appId: ${APP_ID}
name: Create Multiple Clients
env:
  APP_ID: com.bishal.invoice.dev
  ADMIN_EMAIL: deverbishal331@gmail.com
  ADMIN_PASSWORD: Bishal@xiomi222
  BUSINESS_NAME_1: Care To You
  BUSINESS_NAME_2: Seed Care North
  BUSINESS_NAME_3: Seed Care West
---
- launchApp:
    clearState: true

- assertVisible: "Login"
- extendedWaitUntil:
    visible: "Enter your email"
    timeout: 20000
- tapOn:
    point: 50%,43%
- inputText: ${ADMIN_EMAIL}
- extendedWaitUntil:
    visible: "Enter your password"
    timeout: 10000
- tapOn:
    point: 50%,52%
- inputText: ${ADMIN_PASSWORD}
- tapOn:
    point: 0%,35%
- tapOn: "Sign in"

- extendedWaitUntil:
    visible: "ASSIGN"
    timeout: 30000

# ── CLIENT 1 ──────────────────────────────────────────────
- scrollUntilVisible:
    element:
      text: "Add Client"
- tapOn: "Add Client"
- extendedWaitUntil:
    visible: "First Name"
    timeout: 15000
- tapOn:
    text: First Name
    index: 1
- inputText: "Maya"
- tapOn:
    text: Last Name
    index: 1
- inputText: "Client"
- tapOn: done
- tapOn:
    text: Email Address
    index: 1
- inputText: "client.seed.1@mailinator.com"
- tapOn: done
- tapOn:
    text: Phone Number
    index: 1
- inputText: "0400000001"
- scrollUntilVisible:
    element:
      text: "Street Address"
- tapOn: "Street Address"
- inputText: "101 Seed Street"
- tapOn:
    text: City
    index: 1
- inputText: "Sydney"
- tapOn:
    text: State
    index: 1
- inputText: "NSW"
- tapOn: "ZIP Code"
- inputText: "2000"
- scrollUntilVisible:
    element:
      text: "Select Business Name"
- tapOn: "Select Business Name"
- tapOn: ${BUSINESS_NAME_1}
- tapOn:
    point: 0%,20%
- scrollUntilVisible:
    element:
      text: "ADD CLIENT"
    direction: DOWN
# Use index: 1 to skip the AppBar "ADD CLIENT" title and hit the form button
- tapOn:
    text: "ADD CLIENT"
    index: 1
- extendedWaitUntil:
    visible: "Are you sure you want to add this client?"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
# Use the semanticsLabel set in Flutter source: 'Confirm Add Client Dialog'
- tapOn: Confirm Add Client Dialog

- extendedWaitUntil:
    visible: "ASSIGN"
    timeout: 20000

# ── CLIENT 2 ──────────────────────────────────────────────
- scrollUntilVisible:
    element:
      text: "Add Client"
- tapOn: "Add Client"
- extendedWaitUntil:
    visible: "First Name"
    timeout: 15000
- tapOn:
    text: First Name
    index: 1
- inputText: "Noah"
- tapOn:
    text: Last Name
    index: 1
- inputText: "Client"
- tapOn: done
- tapOn:
    text: Email Address
    index: 1
- inputText: "client.seed.2@mailinator.com"
- tapOn: done
- tapOn:
    text: Phone Number
    index: 1
- inputText: "0400000002"
- scrollUntilVisible:
    element:
      text: "Street Address"
- tapOn: "Street Address"
- inputText: "202 Harbor Road"
- tapOn:
    text: City
    index: 1
- inputText: "Melbourne"
- tapOn:
    text: State
    index: 1
- inputText: "VIC"
- tapOn: "ZIP Code"
- inputText: "3000"
- scrollUntilVisible:
    element:
      text: "ADD CLIENT"
    direction: DOWN
- tapOn:
    text: "ADD CLIENT"
    index: 1
- extendedWaitUntil:
    visible: "Are you sure you want to add this client?"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: Confirm Add Client Dialog
- extendedWaitUntil:
    visible: "ASSIGN"
    timeout: 20000

# ── CLIENT 3 ──────────────────────────────────────────────
- scrollUntilVisible:
    element:
      text: "Add Client"
- tapOn: "Add Client"
- extendedWaitUntil:
    visible: "First Name"
    timeout: 15000
- tapOn:
    text: First Name
    index: 1
- inputText: "Zara"
- tapOn:
    text: Last Name
    index: 1
- inputText: "Client"
- tapOn: done
- tapOn:
    text: Email Address
    index: 1
- inputText: "client.seed.3@mailinator.com"
- tapOn: done
- tapOn:
    text: Phone Number
    index: 1
- inputText: "0400000003"
- scrollUntilVisible:
    element:
      text: "Street Address"
- tapOn: "Street Address"
- inputText: "303 River Avenue"
- tapOn:
    text: City
    index: 1
- inputText: "Brisbane"
- tapOn:
    text: State
    index: 1
- inputText: "QLD"
- tapOn: "ZIP Code"
- inputText: "4000"
- tapOn:
    point: 0%,14%

- scrollUntilVisible:
    element:
      text: "ADD CLIENT"
    direction: DOWN
- tapOn:
    text: "ADD CLIENT"
    index: 1
- extendedWaitUntil:
    visible: "Are you sure you want to add this client?"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: Confirm Add Client Dialog
- extendedWaitUntil:
    visible: "ASSIGN"
    timeout: 20000
