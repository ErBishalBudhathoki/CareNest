name: Flutter CI/CD - Secure & Optimized

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - '.github/workflows/flutter_ci_optimized.yml'
  pull_request:
    branches: [ main ]
  # Manual runs of THIS workflow are CI-only. Production is reached exclusively
  # through the separate promote-to-production.yml workflow_dispatch, which
  # promotes a versionCode that already exists on the internal track.
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests (emergency only)'
        required: false
        default: false
        type: boolean

# Prevent concurrent deployments
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Set minimum permissions (principle of least privilege)
permissions:
  contents: read
  security-events: write
  pull-requests: write
  checks: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  FLUTTER_VERSION: '3.44.9'
  JAVA_VERSION: '17'
  RUBY_VERSION: '3.2'

jobs:
  # Security and Quality Checks
  security-scan:
    name: Security & Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history for better analysis

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate .env from example
        run: cp .env.example .env

      - name: Run dependency audit
        run: |
          # Check for known vulnerabilities in dependencies
          dart pub audit || echo "::warning::Vulnerabilities found in dependencies"

      # sync_manager_test.dart imports sync_manager_test.mocks.dart, which
      # mockito generates and .gitignore excludes. The analyzer resolves imports
      # at a fresh checkout, so it must run after codegen or it reports the
      # missing file as a hard error and fails the gate.
      - name: Generate mockito mocks
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze code
        run: flutter analyze --fatal-infos

      - name: Check formatting
        # Scope to first-party sources. Vendored third_party/ overrides are
        # intentionally left unformatted: they are upstream code we mirror and
        # must not restyle (see AGENTS.md).
        run: dart format --output=none --set-exit-if-changed lib test integration_test

  # Run Tests
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: security-scan
    if: github.event.inputs.skip_tests != 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate .env from example
        run: cp .env.example .env

      # sync_manager_test.dart and enhanced_invoice_service_test.dart import
      # *.mocks.dart, which mockito generates and .gitignore excludes. Without
      # this step a fresh checkout cannot compile those two files and the whole
      # run fails, not just the affected tests.
      - name: Generate mockito mocks
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run unit tests
        run: flutter test --coverage --reporter expanded

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: flutter-coverage
          fail_ci_if_error: false

      - name: Generate coverage report
        run: |
          # Install lcov for coverage reporting
          sudo apt-get update && sudo apt-get install -y lcov
          genhtml coverage/lcov.info -o coverage/html

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: |
            coverage/
            test-reports/

  # Build Android
  build-android:
    name: Build Android (${{ matrix.build-type }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [security-scan, test]
    # `always()` here used to let a RED test job still produce a release AAB.
    # A failed test must never be deployable, so require the test gate too.
    if: >-
      needs.security-scan.result == 'success' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        build-type: [debug, release]
        include:
          - build-type: debug
            build-name: 'Debug Build'
          - build-type: release
            build-name: 'Release Build'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Resolve release version from pubspec.yaml
        id: release-version
        run: |
          VERSION_LINE="$(grep -m1 '^version:' pubspec.yaml || true)"
          VERSION_NAME="$(printf '%s' "$VERSION_LINE" | sed -E 's/^version:[[:space:]]*//; s/\+.*$//')"
          VERSION_CODE="$(printf '%s' "$VERSION_LINE" | sed -E 's/^.*\+//')"
          if ! [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || [ "$VERSION_CODE" -le 0 ]; then
            echo "::error::pubspec.yaml needs 'version: <name>+<integer code>'."
            exit 1
          fi
          if [ -z "$VERSION_NAME" ]; then
            echo "::error::pubspec.yaml version name is empty."
            exit 1
          fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Resolved versionName=$VERSION_NAME versionCode=$VERSION_CODE"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # .env.example deliberately contains DIFFERENT hosts from the real .env.
      # Falling back to it for a release build used to produce a production AAB
      # wired to the wrong backend — silently, with no build failure.
      - name: Restore .env (release requires the real secret)
        if: matrix.build-type == 'release'
        env:
          ENV_FILE_B64: ${{ secrets.ENV_FILE }}
        run: |
          if [ -z "$ENV_FILE_B64" ]; then
            echo "::error::secrets.ENV_FILE is not configured. Refusing to build a production AAB from .env.example: its PRODUCTION_URL/DEVELOPMENT_URL hosts do not match the deployed backends."
            exit 1
          fi
          echo "$ENV_FILE_B64" | base64 -d > .env

      - name: Restore .env (debug builds)
        if: matrix.build-type != 'release'
        run: cp .env.example .env

      - name: Validate production API config (values are never printed)
        if: matrix.build-type == 'release'
        run: |
          python3 - <<'PY'
          import re, sys
          from pathlib import Path
          from urllib.parse import urlparse

          def get(key):
              for line in Path('.env').read_text(errors='replace').splitlines():
                  m = re.match(r'^\s*' + re.escape(key) + r'\s*=\s*(.*?)\s*$', line)
                  if m:
                      return m.group(1).strip().strip('"').strip("'")
              return None

          def fail(msg):
              print('::error::' + msg)
              sys.exit(1)

          prod, dev = get('PRODUCTION_URL'), get('DEVELOPMENT_URL')
          if not prod:
              fail('PRODUCTION_URL missing from the restored .env')
          parsed = urlparse(prod)
          if parsed.scheme != 'https' or not parsed.netloc:
              fail('PRODUCTION_URL must be an absolute HTTPS URL')
          host = (parsed.hostname or '').lower()
          placeholders = ('example.', 'localhost', '127.0.0.1', '10.0.2.2',
                          'your-', 'placeholder', '<')
          if any(p in host for p in placeholders):
              fail('PRODUCTION_URL looks like a placeholder or local host')
          if not dev:
              fail('DEVELOPMENT_URL missing from the restored .env')
          if (urlparse(dev).hostname or '').lower() == host:
              fail('PRODUCTION_URL and DEVELOPMENT_URL must not share a host')
          if (get('ENABLE_DEV_SUBSCRIPTION_RESET') or '').lower() in ('true', '1', 'yes'):
              fail('Developer-only subscription reset must be off in a release build')
          print('Production API config validated: HTTPS, non-placeholder, distinct from development.')
          PY

      - name: Restore google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json
          echo "${{ secrets.GOOGLE_SERVICES_JSON_DEV }}" | base64 -d > android/app/src/development/google-services.json

      - name: Decode keystore (Release only)
        if: matrix.build-type == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
            echo "Keystore decoded."
          else
            echo "::warning::No Android keystore secret configured"
          fi

      - name: Create key.properties (Release only)
        if: matrix.build-type == 'release'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -f android/app/keystore.jks ]; then
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=keystore.jks\n' \
              "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
            echo "key.properties created."
          fi

      - name: Build Android ${{ matrix.build-type }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ "${{ matrix.build-type }}" == "release" ] && [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No Android keystore secret configured, skipping release build"
            exit 0
          fi

          # Inject non-secret build config via --dart-define (values read from the
          # restored .env file). Secrets are never passed here.
          DEFINES=()
          for key in PRODUCTION_URL DEVELOPMENT_URL UNIVERSAL_LINK_HOST; do
            value=$(grep -m1 "^${key}=" .env 2>/dev/null | cut -d= -f2- | tr -d '[:space:]' || true)
            if [ -n "$value" ]; then
              DEFINES+=(--dart-define=$key=$value)
            fi
          done

          if [ "${{ matrix.build-type }}" == "release" ]; then
            # versionCode comes from pubspec.yaml, NOT github.run_number: the
            # latter is a per-workflow counter that can be lower than a code
            # already published on any Play track (internal currently holds
            # 227). fastlane re-verifies this against all live tracks.
            flutter build appbundle --release --flavor production \
              --build-name=${{ steps.release-version.outputs.version_name }} \
              --build-number=${{ steps.release-version.outputs.version_code }} \
              "${DEFINES[@]}"
          else
            flutter build apk --debug --flavor production --target-platform android-arm64 "${DEFINES[@]}"
          fi

      - name: Sign APK/AAB with apksigner (additional verification)
        if: matrix.build-type == 'release'
        run: |
          # Verify the signature
          $ANDROID_HOME/build-tools/*/apksigner verify build/app/outputs/bundle/productionRelease/app-production-release.aab || \
            echo "::warning::APK/AAB verification failed"

      - name: Generate SBOM (Software Bill of Materials)
        if: matrix.build-type == 'release'
        run: |
          # Generate SBOM for supply chain security
          mkdir -p build
          flutter pub deps --json > build/sbom.json

      - name: Upload debug build artifacts
        if: matrix.build-type == 'debug'
        uses: actions/upload-artifact@v7
        with:
          name: android-debug-build
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Upload release build artifacts
        if: matrix.build-type == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: android-release-build
          path: |
            build/app/outputs/bundle/productionRelease/app-production-release.aab
            build/sbom.json
          if-no-files-found: warn
          retention-days: 30

      - name: Cleanup sensitive files
        if: always()
        run: |
          rm -f android/app/keystore.jks
          rm -f android/key.properties

  # Deploy to Google Play — INTERNAL ONLY, on pushes to main.
  # Production is a separate manual workflow_dispatch that promotes an
  # already-tested internal versionCode; see promote-to-production.yml.
  deploy-android:
    name: Deploy to Google Play (internal)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [security-scan, test, build-android]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.security-scan.result == 'success' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      needs.build-android.result == 'success'
    environment:
      name: internal
      url: https://play.google.com/console
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: false

      - name: Install Fastlane
        working-directory: android
        run: |
          gem install bundler
          bundle install

      - name: Download release build
        uses: actions/download-artifact@v8
        with:
          name: android-release-build
          path: ./

      - name: Place AAB for Fastlane
        run: |
          mkdir -p build/app/outputs/bundle/productionRelease
          find . -name 'app-production-release.aab' -type f | head -n1 | xargs -I{} cp {} build/app/outputs/bundle/productionRelease/app-production-release.aab
          ls -la build/app/outputs/bundle/productionRelease/

      - name: Setup Google Play credentials
        env:
          GOOGLE_PLAY_API_KEY: ${{ secrets.GOOGLE_PLAY_API_KEY }}
        run: |
          # Create API key file securely
          mkdir -p android/fastlane
          echo "$GOOGLE_PLAY_API_KEY" > android/fastlane/google-play-service-key.json
          
          # Set restrictive permissions
          chmod 600 android/fastlane/google-play-service-key.json

      - name: Resolve release version from pubspec.yaml
        id: deploy-version
        run: |
          VERSION_LINE="$(grep -m1 '^version:' pubspec.yaml || true)"
          VERSION_NAME="$(printf '%s' "$VERSION_LINE" | sed -E 's/^version:[[:space:]]*//; s/\+.*$//')"
          VERSION_CODE="$(printf '%s' "$VERSION_LINE" | sed -E 's/^.*\+//')"
          if ! [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || [ "$VERSION_CODE" -le 0 ]; then
            echo "::error::pubspec.yaml needs 'version: <name>+<integer code>'."
            exit 1
          fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Deploying versionName=$VERSION_NAME versionCode=$VERSION_CODE to internal"

      - name: Fail if versionCode is not strictly higher than every Play track
        working-directory: android
        env:
          SUPPLY_JSON_KEY: fastlane/google-play-service-key.json
          VERSION_CODE: ${{ steps.deploy-version.outputs.version_code }}
          VERSION_NAME: ${{ steps.deploy-version.outputs.version_name }}
        run: fastlane android verify_version_code

      - name: Deploy to INTERNAL with Fastlane
        working-directory: android
        env:
          SUPPLY_JSON_KEY: fastlane/google-play-service-key.json
          VERSION_CODE: ${{ steps.deploy-version.outputs.version_code }}
          VERSION_NAME: ${{ steps.deploy-version.outputs.version_name }}
        run: fastlane android upload_internal_aab

      - name: Cleanup sensitive files
        if: always()
        run: |
          rm -f android/fastlane/google-play-service-key.json

      - name: Create deployment summary
        if: success()
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## 🚀 Internal deployment successful

          **Track:** internal
          **Version:** ${{ steps.deploy-version.outputs.version_name }}+${{ steps.deploy-version.outputs.version_code }}
          **Commit:** ${{ github.sha }}
          **Deployed by:** ${{ github.actor }}

          ### Next Steps
          - Test this exact versionCode on the internal track.
          - Run the manual **Promote to Production** workflow with that versionCode
            once testing passes. Nothing in this workflow can reach production.
          - Monitor crash reports and analytics.
          EOF

  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [security-scan, test, build-android, deploy-android]
    if: failure()
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Send Slack notification
        if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v4
        with:
          payload: |
            {
              "text": "❌ Flutter CI/CD Failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Flutter CI/CD Pipeline Failed*\n\n*Repository:* ${{ github.repository }}\n*Branch:* ${{ github.ref_name }}\n*Commit:* ${{ github.sha }}\n*Triggered by:* ${{ github.actor }}\n\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
