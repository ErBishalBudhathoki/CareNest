name: Backend Deploy - Production (Secure & Optimized)

on:
  workflow_dispatch:
    inputs:
      deploy_type:
        description: 'Deployment type'
        required: true
        default: 'gradual'
        type: choice
        options:
          - gradual
          - immediate
          - canary
      skip_approval:
        description: 'Skip manual approval (emergency only)'
        required: false
        default: false
        type: boolean

# Prevent concurrent production deployments
concurrency:
  group: backend-prod
  cancel-in-progress: false

# Minimum required permissions
permissions:
  contents: read
  security-events: write
  id-token: write
  deployments: write

env:
  NODE_VERSION: '22'
  REGION: 'australia-southeast1'
  SERVICE_NAME: 'backend-prod'
  REGISTRY: 'australia-southeast1-docker.pkg.dev'

jobs:
  # Security and Quality Gates
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trivy scanner (BLOCK on CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './backend'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'  # Fail on findings

      - name: Upload security results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Secret scanning
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./backend
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (BLOCK on HIGH)
        run: npm audit --audit-level=high

      - name: Check for license compliance
        run: npx license-checker --summary || echo "::warning::License check not configured"

  # Comprehensive Testing
  test:
    name: Production Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: security-gate
    defaults:
      run:
        working-directory: ./backend
    services:
      mongodb:
        image: mongo:7.0
        env:
          MONGO_INITDB_ROOT_USERNAME: test
          MONGO_INITDB_ROOT_PASSWORD: testpass
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/test?authSource=admin
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-key
        run: npm test -- --coverage --ci --maxWorkers=2

      - name: Check test coverage threshold
        run: |
          # Require minimum 70% coverage for production
          npx nyc check-coverage --lines 70 --functions 70 --branches 70 || \
            echo "::error::Test coverage below 70% threshold"

      - name: Run integration tests
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/test?authSource=admin
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-key
        run: npm run test:integration

      - name: Run E2E tests
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/test?authSource=admin
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-key
        run: npm run test:e2e || echo "::warning::E2E tests not configured"

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage/lcov.info
          flags: backend-production
          fail_ci_if_error: true

  # Build Production Image
  build:
    name: Build Production Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [security-gate, test]
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-uri: ${{ steps.build.outputs.image-uri }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version
        id: version
        run: |
          VERSION=$(git describe --tags --always --dirty)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Generated version: $VERSION"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.PROD_WIF_PROVIDER }}
          service_account: ${{ secrets.PROD_WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.PROD_FIREBASE_PROJECT_ID }}

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGISTRY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ secrets.PROD_FIREBASE_PROJECT_ID }}/backend-repo/${{ env.SERVICE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=sha,prefix=prod-
            type=raw,value=latest
            type=raw,value=stable

      - name: Build and push production image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.version.outputs.version }}
          provenance: true
          sbom: true

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ secrets.PROD_FIREBASE_PROJECT_ID }}/backend-repo/${{ env.SERVICE_NAME }}:${{ github.sha }}
          format: spdx-json
          output-file: backend-prod-sbom.spdx.json

      - name: Scan production image (BLOCK on CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ secrets.PROD_FIREBASE_PROJECT_ID }}/backend-repo/${{ env.SERVICE_NAME }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-image-results.sarif'

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: production-sbom
          path: backend-prod-sbom.spdx.json
          retention-days: 90

      - name: Sign image with Cosign
        if: ${{ secrets.COSIGN_PRIVATE_KEY }}
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          # Sign the container image
          echo "$COSIGN_PRIVATE_KEY" > cosign.key
          cosign sign --key cosign.key \
            ${{ env.REGISTRY }}/${{ secrets.PROD_FIREBASE_PROJECT_ID }}/backend-repo/${{ env.SERVICE_NAME }}:${{ github.sha }}
          rm cosign.key

      - name: Set image URI
        id: image-uri
        run: |
          IMAGE_URI="${{ env.REGISTRY }}/${{ secrets.PROD_FIREBASE_PROJECT_ID }}/backend-repo/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          echo "image-uri=$IMAGE_URI" >> $GITHUB_OUTPUT

  # Manual Approval Gate
  approval:
    name: Production Approval
    runs-on: ubuntu-latest
    needs: build
    if: github.event.inputs.skip_approval != 'true'
    environment:
      name: production-approval
    steps:
      - name: Wait for approval
        run: echo "Deployment approved by ${{ github.actor }}"

  # Deploy to Production
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build, approval]
    if: always() && (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    environment:
      name: production
      url: https://${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.PROD_WIF_PROVIDER }}
          service_account: ${{ secrets.PROD_WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.PROD_FIREBASE_PROJECT_ID }}

      - name: Create deployment revision
        id: deploy
        run: |
          IMAGE_URI="${{ needs.build.outputs.image-uri }}"
          VERSION="${{ needs.build.outputs.version }}"
          
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "$IMAGE_URI" \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --min-instances 1 \
            --max-instances 100 \
            --cpu 2 \
            --memory 1Gi \
            --timeout 300 \
            --cpu-boost \
            --port 8080 \
            --set-env-vars "NODE_ENV=production,VERSION=$VERSION,APP_CHECK_ENFORCEMENT=true" \
            --set-secrets "MONGODB_URI=PROD_MONGODB_URI:latest,JWT_SECRET=PROD_JWT_SECRET:latest,REDIS_URL=PROD_REDIS_URL:latest" \
            --service-account ${{ secrets.PROD_CLOUD_RUN_SA }} \
            --vpc-connector ${{ secrets.PROD_VPC_CONNECTOR }} \
            --vpc-egress all-traffic \
            --no-traffic \
            --tag v$VERSION
          
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --format 'value(status.url)')
          
          echo "url=$SERVICE_URL" >> $GITHUB_OUTPUT

      - name: Run production smoke tests
        run: |
          SERVICE_URL="${{ steps.deploy.outputs.url }}"
          
          # Wait for service
          sleep 15
          
          # Health checks
          curl -f "$SERVICE_URL/health" || exit 1
          curl -f "$SERVICE_URL/api/health" || exit 1
          
          echo "::notice::Smoke tests passed"

      - name: Deploy with strategy
        run: |
          DEPLOY_TYPE="${{ github.event.inputs.deploy_type || 'gradual' }}"
          
          case $DEPLOY_TYPE in
            "canary")
              echo "::notice::Deploying canary (10% traffic)"
              gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
                --region ${{ env.REGION }} \
                --to-latest=10
              
              echo "::warning::Monitor canary for 10 minutes before proceeding"
              sleep 600
              
              gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
                --region ${{ env.REGION }} \
                --to-latest=100
              ;;
            
            "gradual")
              echo "::notice::Gradual rollout: 25% -> 50% -> 75% -> 100%"
              
              gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
                --region ${{ env.REGION }} \
                --to-latest=25
              sleep 180
              
              gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
                --region ${{ env.REGION }} \
                --to-latest=50
              sleep 180
              
              gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
                --region ${{ env.REGION }} \
                --to-latest=75
              sleep 180
              
              gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
                --region ${{ env.REGION }} \
                --to-latest=100
              ;;
            
            "immediate")
              echo "::warning::Immediate rollout to 100%"
              gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
                --region ${{ env.REGION }} \
                --to-latest=100
              ;;
          esac

      - name: Verify deployment
        run: |
          # Check service is healthy
          gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --format 'get(status.conditions)'
          
          # Check latest revision is serving
          LATEST_REVISION=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --format 'value(status.latestReadyRevisionName)')
          
          echo "::notice::Latest revision: $LATEST_REVISION"

      - name: Create deployment record
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## 🚀 Production Deployment Successful
          
          **Service:** ${{ env.SERVICE_NAME }}
          **Region:** ${{ env.REGION }}
          **Version:** ${{ needs.build.outputs.version }}
          **URL:** ${{ steps.deploy.outputs.url }}
          **Image:** ${{ needs.build.outputs.image-uri }}
          **Strategy:** ${{ github.event.inputs.deploy_type || 'gradual' }}
          **Deployed by:** ${{ github.actor }}
          **Timestamp:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          ### Post-Deployment Checklist
          - [ ] Monitor error rates in Cloud Logging
          - [ ] Check latency metrics in Cloud Monitoring
          - [ ] Verify critical user flows
          - [ ] Monitor database performance
          - [ ] Check Redis cache hit rates
          - [ ] Review security alerts
          
          ### Rollback Command
          \`\`\`bash
          gcloud run services update-traffic ${{ env.SERVICE_NAME }} \\
            --region ${{ env.REGION }} \\
            --to-revisions PREVIOUS_REVISION=100
          \`\`\`
          EOF

  # Post-deployment validation
  validate:
    name: Post-Deployment Validation
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Run health checks
        run: |
          # Production health endpoint
          curl -f "${{ needs.deploy.outputs.url }}/health" || exit 1

      - name: Check error rates
        run: |
          # Query Cloud Logging for errors in last 5 minutes
          gcloud logging read "resource.type=cloud_run_revision AND severity>=ERROR" \
            --limit 50 \
            --format json || echo "::warning::Cannot fetch logs"

      - name: Monitor metrics
        run: |
          echo "::notice::Monitor production metrics for next 30 minutes"
          # Could integrate with monitoring tools here

  # Notify stakeholders
  notify:
    name: Notify Stakeholders
    runs-on: ubuntu-latest
    needs: [security-gate, test, build, deploy, validate]
    if: always()
    steps:
      - name: Send Slack notification
        if: ${{ secrets.SLACK_WEBHOOK_URL }}
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "${{ needs.deploy.result == 'success' ? '🎉' : '❌' }} Production Deployment",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Production Backend Deployment*\n\n*Status:* ${{ needs.deploy.result }}\n*Version:* ${{ needs.build.outputs.version }}\n*Environment:* Production\n*Service:* ${{ env.SERVICE_NAME }}\n*URL:* ${{ needs.deploy.outputs.url }}\n*Deployed by:* ${{ github.actor }}\n\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Next Steps:*\n• Monitor error rates\n• Check user metrics\n• Review performance\n• Verify critical paths"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Create GitHub Release
        if: needs.deploy.result == 'success'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: backend-v${{ needs.build.outputs.version }}
          name: Backend v${{ needs.build.outputs.version }}
          body: |
            ## Backend Production Release
            
            **Version:** ${{ needs.build.outputs.version }}
            **Deployed:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
            **Image:** ${{ needs.build.outputs.image-uri }}
            
            ### Changes
            ${{ github.event.head_commit.message }}
            
            ### Deployment
            - Service: ${{ env.SERVICE_NAME }}
            - Region: ${{ env.REGION }}
            - Strategy: ${{ github.event.inputs.deploy_type || 'gradual' }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
