name: Flutter CI (Legacy - CI only)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # CI only. This legacy workflow has no deployment steps: main pushes deploy
  # to internal via flutter_ci_optimized.yml, and production promotion is the
  # separate manual promote-to-production.yml workflow_dispatch.
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Setup Java 17 (Required for Android Gradle Plugin 8.0+)
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # Setup Flutter
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'
          cache: true

      # Install Dependencies
      - run: flutter pub get

      # Regenerate localization classes from ARB files so `flutter analyze`
      # sees the current keys (generated sources are committed but can lag).
      - run: flutter gen-l10n

      # Generate .env from example so the declared asset exists in CI
      - run: cp .env.example .env

      # sync_manager_test.dart imports sync_manager_test.mocks.dart, which
      # mockito generates and .gitignore excludes. The analyzer resolves
      # imports at a fresh checkout, so it must run after codegen.
      - run: dart run build_runner build --delete-conflicting-outputs

      # Static Analysis (Fail fast if code is bad)
      - run: flutter analyze

      # Setup Ruby for Fastlane
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false
          working-directory: android

      # Install Fastlane
      - name: Install Fastlane
        working-directory: android
        run: |
          gem install bundler
          bundle install || gem install fastlane

      # Deployment is handled by flutter_ci_optimized.yml (workflow_dispatch only)
