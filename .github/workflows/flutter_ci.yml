name: Flutter CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Deploy target (development, production, or internal)'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - production
          - internal

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Setup Java 17 (Required for Android Gradle Plugin 8.0+)
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # Setup Flutter
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true

      # Install Dependencies
      - run: flutter pub get

      # Static Analysis (Fail fast if code is bad)
      - run: flutter analyze

      # Setup Ruby for Fastlane
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'
          bundler-cache: true
          working-directory: android

      # Install Fastlane
      - name: Install Fastlane
        working-directory: android
        run: |
          gem install bundler
          bundle install || gem install fastlane

      # Deploy to Google Play (Only on push to main or workflow_dispatch)
      - name: Deploy to Google Play
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        working-directory: android
        env:
          GOOGLE_PLAY_API_KEY: ${{ secrets.GOOGLE_PLAY_API_KEY }}
        run: |
          # Create the API key file from secret
          echo "$GOOGLE_PLAY_API_KEY" > fastlane/google-play-service-key.json
          
          # Determine the lane to run
          TARGET_LANE="deploy_${{ github.event.inputs.deploy_target || 'development' }}"
          
          # On push to main, default to development (safer than production)
          if [ "${{ github.event_name }}" == "push" ]; then
             TARGET_LANE="deploy_development"
          fi
          
          echo "Running Fastlane lane: $TARGET_LANE"
          fastlane $TARGET_LANE
