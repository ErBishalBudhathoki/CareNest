name: Flutter CI (Legacy - CI only)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Deploy target (development, production, or internal)'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - production
          - internal

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Setup Java 17 (Required for Android Gradle Plugin 8.0+)
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # Setup Flutter
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'
          cache: true

      # Install Dependencies
      - run: flutter pub get

      # Generate .env from example so the declared asset exists in CI
      - run: cp .env.example .env

      # Static Analysis (Fail fast if code is bad)
      - run: flutter analyze

      # Setup Ruby for Fastlane
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false
          working-directory: android

      # Install Fastlane
      - name: Install Fastlane
        working-directory: android
        run: |
          gem install bundler
          bundle install || gem install fastlane

      # Deployment is handled by flutter_ci_optimized.yml (workflow_dispatch only)
