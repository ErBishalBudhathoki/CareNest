dev_dependencies:
  flutter_lints: ^5.0.0
  lints: ^5.1.1
  flutter_launcher_icons: ^0.14.2
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  mockito: any
  test: any
  # Property-based testing support
  faker: ^2.1.0
  # Visual regression testing
  golden_toolkit: ^0.15.0
  # Performance testing
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  # Screenshot comparison
  screenshot: ^2.3.0
  patrol: ^4.5.0

dependency_overrides:
  google_mlkit_commons:
    path: third_party/google_mlkit_commons
  google_mlkit_text_recognition:
    path: third_party/google_mlkit_text_recognition

flutter:
  generate: true
  assets:
    - .env
    - assets/images/client-profile.png
    - assets/images/placeholder_product.png
    - assets/images/invoice_banner.png
    - assets/images/Invo.gif
    - assets/images/splash_gif.gif
    - assets/images/ud.gif
    - assets/images/splash_screen.png
    - assets/images/splash_screen.gif
    - assets/images/grid_pattern.png
    - assets/icons/profile_placeholder.png
    - assets/icons/3D Icons/
    - assets/icons/PNG with shadow/
    - assets/images/he_sitting_with_notebook.png
    - assets/images/she_with_phone.png
    - lib/main.dart
    - assets/lottieAnimationJSON/loading_horizontal_line.json
    - assets/lottieAnimationJSON/warning.json
    - assets/ndis_support_items.json
    - assets/icons/
    - assets/icons/ic_launcher.png
    - assets/ui_assets_svg/
  uses-material-design: true
  fonts:
    - family: Lato
      fonts:
        - asset: assets/fonts/lato/Lato-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/ic_launcher_clean.png"
  adaptive_icon_background: "#1A5874"
  adaptive_icon_foreground: "assets/icons/ic_launcher_foreground_clean.png"
  
  # Development flavor configuration
  development:
    android: true
    ios: true
    image_path: "assets/icons/ic_launcher_clean.png"
    adaptive_icon_background: "#1A5874"
    adaptive_icon_foreground: "assets/icons/ic_launcher_foreground_clean.png"
    
  # Production flavor configuration
  production:
    android: true
    ios: true
    image_path: "assets/icons/ic_launcher_clean.png"
    adaptive_icon_background: "#1A5874"
    adaptive_icon_foreground: "assets/icons/ic_launcher_foreground_clean.png"
