name: carenest
description: Conversion of invoice desktop app to mobile
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 4.4.0+52

environment:
  sdk: ">=3.11.5 <4.0.0"

dependencies:
  connectivity_plus: ^7.1.1
  json_annotation: ^4.8.1
  http: ^1.2.2
  shared_preferences: ^2.2.2
  curved_navigation_bar: ^1.0.6
  another_flushbar: ^2.2.4
  # flutter_calendar_widget: ^0.0.2
  table_calendar: ^3.0.8
  intl: ^0.20.2
  flutter_local_notifications: ^22.2.0
  share_plus: ^13.3.0
  animation_list: ^3.1.0
  uuid: ^4.5.1
  pdf: ^3.11.1
  permission_handler: ^13.0.0
  page_view_dot_indicator: ^2.3.0

  cloud_firestore: ^6.8.0
  path_provider: ^2.1.5
  google_mlkit_text_recognition: ^0.16.0
  flutter_secure_storage: ^10.3.1
  # document_file_save_plus: ^2.0.0
  file_picker: ^12.0.0-beta.7
  image_picker: ^1.0.4
  url_launcher: ^6.1.11
  open_file: ^4.0.0
  map_launcher: ^6.0.0
  fl_chart: ^1.2.0
  # uni_links: 0.5.1
  app_links: ^7.0.0
  pinput: ^6.0.2
  persistent_bottom_nav_bar_v2: ^6.3.2
  crypto: ^3.0.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  argon2: ^1.0.1
  lottie: ^3.1.3
  media_store_plus: ^0.1.3

  firebase_messaging: ^16.5.0
  firebase_storage: ^13.4.6
  firebase_app_check: ^0.4.6
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  firebase_crashlytics: ^5.2.7

  image_cropper: ^12.2.1
  speech_to_text: ^7.1.0
  cached_network_image: ^3.3.1
  pdfx: ^2.9.2
  get_it: ^9.2.1
  smooth_page_indicator: ^2.0.1

  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  geolocator: ^14.0.3
  socket_io_client: ^3.1.6
  encrypt: ^5.0.3
  signature: ^6.4.0
  freezed_annotation: ^3.1.0
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3

  google_maps_flutter: ^2.1.1
  apple_maps_flutter: ^1.3.0
  qr_flutter: ^4.1.0

  flutter_animate: ^4.5.0
  dotted_border: ^3.1.0
  blur: ^4.0.2
  google_fonts: ^8.2.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0

  logging: ^1.2.0
  device_info_plus: ^13.2.0 
  package_info_plus: ^10.2.1
  archive: ^3.6.1
  iconsax: ^0.0.8
  geocoding: ^5.0.0
  dio: ^5.4.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.2
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  mockito: any
  test: any
  # Property-based testing support
  faker: ^2.1.0
  # Visual regression testing
  golden_toolkit: ^0.15.0
  # Performance testing
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  # Screenshot comparison
  screenshot: ^3.0.0
  patrol: ^4.5.0

dependency_overrides:
  google_mlkit_commons:
    path: third_party/google_mlkit_commons
  google_mlkit_text_recognition:
    path: third_party/google_mlkit_text_recognition
  # Server-only pin: avoid jni native build on aarch64 container
  path_provider_android: 2.2.23

flutter:
  generate: true
  assets:
    - assets/images/Invo.gif
    - assets/images/splash_screen.webp
    - assets/images/grid_pattern.png
    - assets/images/he_sitting_with_notebook.png
    - assets/images/she_with_phone.png
    - assets/icons/profile_placeholder.png
    - assets/icons/3D Icons/3dicons-flash-dynamic-color.png
    - assets/icons/3D Icons/3dicons-lock-dynamic-color.png
    - assets/icons/3D Icons/3dicons-mail-dynamic-color.png
    - assets/icons/3D Icons/3dicons-setting-dynamic-color.png
    - assets/icons/3D Icons/3dicons-shield-dynamic-color.png
    - assets/icons/3D Icons/business.png
    - assets/lottieAnimationJSON/loading_horizontal_line.json
    - assets/lottieAnimationJSON/warning.json
    - assets/ndis_support_items.json
    - assets/ui_assets_svg/onboarding_bank.svg
    - assets/ui_assets_svg/onboarding_final_docs.svg
    - assets/ui_assets_svg/onboarding_identity_docs.svg
    - assets/ui_assets_svg/onboarding_personal.svg
    - assets/ui_assets_svg/onboarding_super.svg
    - assets/ui_assets_svg/onboarding_tax.svg
    - assets/ui_assets_svg/onboarding_welcome.svg
    - assets/ui_assets_svg/undraw_printing-invoices_g6c9.svg
  uses-material-design: true
  fonts:
    - family: Lato
      fonts:
        - asset: assets/fonts/lato/Lato-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/ic_launcher_clean.png"
  adaptive_icon_background: "#1A5874"
  adaptive_icon_foreground: "assets/icons/ic_launcher_foreground_clean.png"
  
  # Development flavor configuration
  development:
    android: true
    ios: true
    image_path: "assets/icons/ic_launcher_clean.png"
    adaptive_icon_background: "#1A5874"
    adaptive_icon_foreground: "assets/icons/ic_launcher_foreground_clean.png"
    
  # Production flavor configuration
  production:
    android: true
    ios: true
    image_path: "assets/icons/ic_launcher_clean.png"
    adaptive_icon_background: "#1A5874"
    adaptive_icon_foreground: "assets/icons/ic_launcher_foreground_clean.png"
